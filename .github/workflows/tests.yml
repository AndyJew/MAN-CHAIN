
name: MAN-CHAIN Tests

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run blockchain demo
        run: python prototype/blockchain.py

      - name: Run blockchain tests
        run: python -m unittest discover -s prototype -p "test_*.py" -v
